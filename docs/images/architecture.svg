<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#9aa3ad;stroke-width:1.2;rx:8}
      .edge{fill:#fff4f2;stroke:#e8392a;stroke-width:1.4}
      .data{fill:#f3f7ff;stroke:#5b7fc7;stroke-width:1.2}
      .ai{fill:#f6f2ff;stroke:#7b5cc4;stroke-width:1.2}
      .t{font-weight:700;fill:#1f2328}
      .s{fill:#57606a;font-size:11.5px}
      .zone{fill:none;stroke:#c8ced6;stroke-dasharray:6 5;stroke-width:1.2}
      .zl{fill:#8a949e;font-size:11.5px;font-weight:600;letter-spacing:.5px}
      .l{stroke:#555;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .lab{fill:#57606a;font-size:11px}
    </style>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>

  <!-- Users -->
  <rect class="box" x="20" y="250" width="110" height="60" rx="8"/>
  <text class="t" x="75" y="276" text-anchor="middle">Visitors</text>
  <text class="s" x="75" y="294" text-anchor="middle">desktop / mobile</text>

  <!-- Edge -->
  <rect class="edge" x="170" y="235" width="150" height="90" rx="8"/>
  <text class="t" x="245" y="262" text-anchor="middle">CloudFront</text>
  <text class="s" x="245" y="280" text-anchor="middle">ACM TLS · www→apex</text>
  <text class="s" x="245" y="296" text-anchor="middle">Route 53 DNS</text>
  <line class="l" x1="130" y1="280" x2="168" y2="280"/>

  <!-- Media -->
  <rect class="data" x="170" y="420" width="150" height="70" rx="8"/>
  <text class="t" x="245" y="447" text-anchor="middle">S3 media</text>
  <text class="s" x="245" y="465" text-anchor="middle">private · CloudFront only</text>
  <line class="l" x1="245" y1="325" x2="245" y2="418"/>
  <text class="lab" x="252" y="378">photos</text>

  <!-- VPC zone -->
  <rect class="zone" x="350" y="40" width="590" height="540" rx="12"/>
  <text class="zl" x="366" y="62">VPC · ap-southeast-2</text>

  <!-- ALB -->
  <rect class="edge" x="370" y="235" width="150" height="90" rx="8"/>
  <text class="t" x="445" y="262" text-anchor="middle">Load balancer</text>
  <text class="s" x="445" y="280" text-anchor="middle">443 from CloudFront</text>
  <text class="s" x="445" y="296" text-anchor="middle">prefix list only · TLS 1.3</text>
  <line class="l" x1="320" y1="280" x2="368" y2="280"/>
  <text class="lab" x="328" y="272">pages</text>

  <!-- EB -->
  <rect class="box" x="560" y="190" width="200" height="180" rx="8"/>
  <text class="t" x="660" y="216" text-anchor="middle">Elastic Beanstalk</text>
  <text class="s" x="660" y="234" text-anchor="middle">t4g · 1–3 · IMDSv2 only</text>
  <rect class="box" x="580" y="248" width="160" height="30" rx="6"/>
  <text class="s" x="660" y="268" text-anchor="middle">web · Django + gunicorn</text>
  <rect class="box" x="580" y="284" width="160" height="30" rx="6"/>
  <text class="s" x="660" y="304" text-anchor="middle">worker · data jobs, backups</text>
  <rect class="box" x="580" y="320" width="160" height="30" rx="6"/>
  <text class="s" x="660" y="340" text-anchor="middle">importer · jobs, reviews</text>
  <line class="l" x1="520" y1="280" x2="558" y2="280"/>

  <!-- RDS -->
  <rect class="data" x="560" y="440" width="200" height="80" rx="8"/>
  <text class="t" x="660" y="467" text-anchor="middle">RDS PostgreSQL</text>
  <text class="s" x="660" y="485" text-anchor="middle">not public · encrypted</text>
  <text class="s" x="660" y="501" text-anchor="middle">deletion-protected · 7d backups</text>
  <line class="l" x1="660" y1="370" x2="660" y2="438"/>

  <!-- Secrets + backups -->
  <rect class="data" x="790" y="90" width="135" height="70" rx="8"/>
  <text class="t" x="857" y="117" text-anchor="middle">Secrets Manager</text>
  <text class="s" x="857" y="135" text-anchor="middle">read via instance role</text>
  <line class="l" x1="760" y1="215" x2="815" y2="162"/>

  <rect class="data" x="790" y="440" width="135" height="80" rx="8"/>
  <text class="t" x="857" y="467" text-anchor="middle">S3 backups</text>
  <text class="s" x="857" y="485" text-anchor="middle">private · versioned</text>
  <line class="l" x1="760" y1="350" x2="815" y2="438"/>

  <!-- AI + email -->
  <rect class="ai" x="790" y="200" width="135" height="70" rx="8"/>
  <text class="t" x="857" y="227" text-anchor="middle">Amazon Bedrock</text>
  <text class="s" x="857" y="245" text-anchor="middle">Claude · Stability</text>
  <line class="l" x1="760" y1="250" x2="788" y2="240"/>

  <rect class="box" x="790" y="300" width="135" height="60" rx="8"/>
  <text class="t" x="857" y="326" text-anchor="middle">Amazon SES</text>
  <text class="s" x="857" y="344" text-anchor="middle">DKIM · DMARC</text>
  <line class="l" x1="760" y1="320" x2="788" y2="328"/>

  <!-- Budgets -->
  <rect class="ai" x="560" y="80" width="200" height="70" rx="8"/>
  <text class="t" x="660" y="107" text-anchor="middle">AWS Budgets</text>
  <text class="s" x="660" y="125" text-anchor="middle">alerts 80/100% · deny 120%</text>
  <line class="l" x1="660" y1="150" x2="660" y2="188"/>
</svg>
